name: ci

on:
  push:
  pull_request:

jobs:
  host:
    name: тесты на хосте
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Конфигурация
        run: cmake -S firmware -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Сборка
        run: cmake --build build --parallel

      - name: Тесты
        run: ctest --test-dir build --output-on-failure

  arm:
    name: кросс-сборка под STM32G431
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Тулчейн arm-none-eabi
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version

      - name: Конфигурация
        run: >
          cmake -S firmware -B build-arm
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/firmware/cmake/arm-none-eabi.cmake
          -DCMAKE_BUILD_TYPE=Release

      - name: Сборка
        run: cmake --build build-arm --parallel

      - name: Проверка FPU
        run: |
          arm-none-eabi-readelf -A build-arm/src/foc/libfoc.a | grep "Tag_ABI_VFP_args: VFP registers"
